services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing123
      POSTGRES_DB: ticketing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing123@postgres:5432/ticketing_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      APP_URL: ${APP_URL:-http://localhost:5173}
      BILLIONMAIL_API_URL: ${BILLIONMAIL_API_URL:-}
      BILLIONMAIL_INVITE_API_KEY: ${BILLIONMAIL_INVITE_API_KEY:-}
      BILLIONMAIL_WELCOME_API_KEY: ${BILLIONMAIL_WELCOME_API_KEY:-}
      BILLIONMAIL_FROM: ${BILLIONMAIL_FROM:-}
      BILLIONMAIL_TLS_INSECURE: ${BILLIONMAIL_TLS_INSECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PRISMA_FORCE_RESET: ${PRISMA_FORCE_RESET:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ticketing.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}
      ADMIN_USERS: ${ADMIN_USERS:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_API_PROXY: http://backend:3002
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  postgres_data:
  uploads_data:
